# ── Compute engine: risk flags ────────────────────────────────────────────────
compute.risk.HIGH_ACWR=High injury risk: acute load is critically elevated
compute.risk.CAUTION_ACWR=Caution: acute load is above the optimal range
compute.risk.UNDERTRAINING=Undertraining: acute load is below the optimal range
compute.risk.HIGH_MONOTONY=High monotony: training is too repetitive
compute.risk.HIGH_RAMP_RATE=High ramp rate: weekly load increase is too rapid
compute.risk.ELEVATED_RAMP_RATE=Elevated ramp rate: load is increasing quickly
compute.risk.DEEP_FATIGUE=Deep fatigue: significant accumulated fatigue detected
# ── Compute engine: recommendations ──────────────────────────────────────────
compute.rec.ACWR_CRITICAL_REDUCE=Reduce training load immediately — ACWR is severely elevated. Take 2–3 easy days before any quality work.
compute.rec.ACWR_HIGH_SCALE_BACK=Scale back intensity and/or volume this week. Target ACWR below 1.5 before resuming hard sessions.
compute.rec.ACWR_CAUTION_MONITOR=Monitor closely. Avoid adding new load this week; maintain current level.
compute.rec.ACWR_LOW_INCREASE=Load is below the optimal range. A gradual increase (≤5 ATU/week) would support fitness development.
compute.rec.RAMP_HIGH=Weekly load increase is too rapid. Connective tissue adapts slower than muscle — cap increases at 8 ATU/week.
compute.rec.RAMP_CAUTION=Ramp rate is elevated. Consider an easy week to allow structural adaptation to catch up.
compute.rec.TSB_OVERTRAINED=Accumulated fatigue is at a critical level (TSB < −35). A full recovery week or more is warranted.
compute.rec.TSB_FATIGUED=Significant fatigue accumulated. Prioritise sleep, nutrition, and reduce intensity before the next hard block.
compute.rec.TSB_TIRED=Mild fatigue present. Normal within a training block; monitor for progression.
compute.rec.TSB_FRESH=Athlete is very fresh. Good window for a peak performance effort or race.
compute.rec.MONOTONY_CRITICAL=Training is highly repetitive. Introduce variation in session type, intensity, or duration to reduce illness risk.
compute.rec.MONOTONY_HIGH=Moderate monotony. Add at least one session this week that differs significantly in format or intensity.
compute.rec.ALL_GOOD=Training load is well-managed. Continue current plan.
