spring:
  application:
    name: StrengthLabsAPI

  datasource:
    url: jdbc:postgresql://localhost:5432/strengthlabs
    username: stlabs
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8000

compute-engine:
  url: http://localhost:8001

jwt:
  # Base64-encoded PKCS8 private key (no PEM headers). Set JWT_PRIVATE_KEY env var in prod.
  private-key: ${JWT_PRIVATE_KEY:}
  # Base64-encoded X.509 public key (no PEM headers). Set JWT_PUBLIC_KEY env var in prod.
  public-key: ${JWT_PUBLIC_KEY:}
  expiration-ms: 86400000
