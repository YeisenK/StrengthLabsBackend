spring:
  application:
    name: StrengthLabsAPI

  datasource:
    url: jdbc:postgresql://localhost:5432/strengthlabs
    username: stlabs
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8000

compute-engine:
  url: http://localhost:8001

jwt:
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-chars}
  expiration-ms: 86400000
