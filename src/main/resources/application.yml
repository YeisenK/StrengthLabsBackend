spring:
  application:
    name: StrengthLabsAPI

  datasource:
    url: jdbc:postgresql://localhost:5432/strengthlabs
    username: stlabs
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8000

compute-engine:
  url: http://localhost:8001

# JWT signing keys are profile-supplied. application-dev.yml carries throwaway
# values for local development; application-prod.yml requires JWT_PRIVATE_KEY
# and JWT_PUBLIC_KEY environment variables and fails fast if they are missing.
# No fallback is provided here so that running without a profile reveals the
# misconfiguration immediately instead of silently using committed keys.
jwt:
  expiration-ms: 86400000

google:
  client-id: ${GOOGLE_CLIENT_ID:REPLACE_WITH_REAL_GOOGLE_CLIENT_ID}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
