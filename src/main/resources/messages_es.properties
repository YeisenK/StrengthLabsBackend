# ── Compute engine: indicadores de riesgo ─────────────────────────────────────
compute.risk.HIGH_ACWR=Riesgo de lesión alto: la carga aguda está críticamente elevada
compute.risk.CAUTION_ACWR=Precaución: la carga aguda supera el rango óptimo
compute.risk.UNDERTRAINING=Entreno insuficiente: la carga aguda está por debajo del rango óptimo
compute.risk.HIGH_MONOTONY=Monotonía alta: el entrenamiento es demasiado repetitivo
compute.risk.HIGH_RAMP_RATE=Tasa de rampa alta: el aumento de carga semanal es demasiado rápido
compute.risk.ELEVATED_RAMP_RATE=Tasa de rampa elevada: la carga está aumentando rápidamente
compute.risk.DEEP_FATIGUE=Fatiga profunda: se detectó fatiga acumulada significativa
# ── Compute engine: recomendaciones ───────────────────────────────────────────
compute.rec.ACWR_CRITICAL_REDUCE=Reduce la carga de entrenamiento de inmediato — el ACWR está críticamente elevado. Toma 2–3 días suaves antes de cualquier sesión intensa.
compute.rec.ACWR_HIGH_SCALE_BACK=Reduce la intensidad o el volumen esta semana. Apunta a un ACWR menor a 1.5 antes de retomar sesiones exigentes.
compute.rec.ACWR_CAUTION_MONITOR=Monitoriza de cerca. Evita agregar carga nueva esta semana; mantén el nivel actual.
compute.rec.ACWR_LOW_INCREASE=La carga está por debajo del rango óptimo. Un aumento gradual (≤5 ATU/semana) favorecería el desarrollo de la condición física.
compute.rec.RAMP_HIGH=El aumento de carga semanal es demasiado rápido. El tejido conectivo se adapta más lento que el músculo — limita los incrementos a 8 ATU/semana.
compute.rec.RAMP_CAUTION=La tasa de rampa está elevada. Considera una semana de descarga para que la adaptación estructural no quede rezagada.
compute.rec.TSB_OVERTRAINED=La fatiga acumulada es crítica (TSB < −35). Se requiere una semana de recuperación completa o más.
compute.rec.TSB_FATIGUED=Fatiga significativa acumulada. Prioriza el sueño, la nutrición y reduce la intensidad antes del próximo bloque duro.
compute.rec.TSB_TIRED=Fatiga leve presente. Normal dentro de un bloque de entrenamiento; monitoriza la progresión.
compute.rec.TSB_FRESH=El atleta está muy descansado. Buena ventana para un esfuerzo de pico de rendimiento o competencia.
compute.rec.MONOTONY_CRITICAL=El entrenamiento es muy repetitivo. Introduce variación en el tipo, la intensidad o la duración de las sesiones para reducir el riesgo de enfermedad.
compute.rec.MONOTONY_HIGH=Monotonía moderada. Agrega al menos una sesión esta semana que difiera significativamente en formato o intensidad.
compute.rec.ALL_GOOD=La carga de entrenamiento está bien gestionada. Continúa con el plan actual.
