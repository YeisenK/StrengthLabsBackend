services:
  postgres:
    image: postgres:16-alpine
    container_name: stlabs-postgres
    environment:
      POSTGRES_DB: strengthlabs
      POSTGRES_USER: stlabs
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: stlabs-redis
    ports:
      - "6379:6379"

  # compute-engine se levanta manualmente con uvicorn en dev para hot reload:
  #   cd recursos && uvicorn api.main:app --port 8001 --reload
  # Para producción, ver Dockerfile.compute (build context: ../recursos).

volumes:
  postgres_data:
